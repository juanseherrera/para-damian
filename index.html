<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Para Damián</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="ambient-glow"></div>

    <section class="invitation" aria-label="Invitación para Damián">
      <div class="envelope-wrap" id="envelopeWrap">
        <button class="envelope" id="envelope" aria-label="Abrir invitación">
          <div class="envelope-back"></div>
          <div class="letter-paper">
            <div class="letter-content">
              <p class="greeting">🎉 ¡Feliz Día del Director, Damián! 🎉</p>

              <p>Con motivo de tu día, queremos aprovechar para agradecerte, agasajarte y, por supuesto, compartir un buen momento juntos. 😊🥂</p>

              <p>Por eso, esta nota es también una <strong>invitación especial al asado del domingo 4 de octubre</strong> 🗓️🥩🔥, donde tendrás el honor de ser nuestro <strong>agasajado</strong>. 🎩👏</p>

              <p class="highlight">Y queremos dejar algo muy claro desde el principio:</p>

              <p class="big-highlight"><strong>¡Vos no ponés un peso!</strong> 😄🙌💰🚫</p>

              <p>El asado, la comida, la bebida y todo lo necesario para pasar un lindo domingo corren por nuestra cuenta. 🍖🍷🥗🔥 Esta vez te toca simplemente sentarte, disfrutar, brindar y dejarte agasajar como corresponde. 😎🥂</p>

              <p>La invitación es de:</p>

              <p class="names"><strong>Diego · Juan · Lucas · Nicolás · Soledad · Victoria</strong></p>

              <p>Esperamos que aceptes esta invitación y que podamos compartir un domingo lleno de buena comida, buenos momentos y, sobre todo, mucha buena onda. 😄🍻🎉</p>

              <p class="closing"><strong>¡Feliz Día del Director, Damián!</strong> 🥳🎊<br>
              ¡El domingo te esperamos para festejarte como corresponde! 🥩🍷🔥🍻</p>
            </div>
          </div>

          <div class="envelope-front">
            <div class="envelope-left"></div>
            <div class="envelope-right"></div>
            <div class="envelope-bottom"></div>
          </div>

          <div class="flap">
            <div class="flap-inner"></div>
          </div>

          <div class="seal" aria-hidden="true">D</div>

          <div class="recipient">Para Damián</div>
        </button>

        <p class="hint" id="hint">Tocá el sobre para abrir tu invitación</p>
      </div>
    </section>

    <div class="music-note" id="musicNote" aria-hidden="true">♪</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
